name: Desktop checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CONVOKE_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux native build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb rpm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and process boundary tests
        run: npm test
      - name: Check publication inputs
        run: npm run check:release
      - name: Windows uninstall launcher boundary
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/test-uninstall.ps1
      - name: Windows desktop checks and packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($task in @('test:ui', 'test:rooms', 'test:capabilities', 'test:workbench', 'test:i18n', 'package:release')) {
            npm run $task
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Ubuntu desktop checks and packages
        if: runner.os == 'Linux'
        run: |
          for task in test:ui test:rooms test:capabilities test:workbench test:i18n package:release; do
            xvfb-run --auto-servernum npm run "$task"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Chorus-${{ runner.os }}-x64
          if-no-files-found: error
          path: |
            dist/Chorus-*-release-*/artifacts/*.exe
            dist/Chorus-*-release-*/artifacts/*.zip
            dist/Chorus-*-release-*/artifacts/*.deb
            dist/Chorus-*-release-*/ARTIFACTS.json
