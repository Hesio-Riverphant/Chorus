name: Desktop checks and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CONVOKE_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux native build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb rpm
      - name: Install locked dependencies
        run: npm ci
      - name: Allow sandboxed Electron on the disposable Ubuntu runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu 24.04 requires an AppArmor userns grant for unpacked Electron.
          # Scope it to this checkout; Chromium's sandbox stays enabled.
          [[ "$GITHUB_WORKSPACE" =~ ^/home/runner/work/[A-Za-z0-9_./-]+$ ]]
          cat > "$RUNNER_TEMP/chorus-ci-apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile chorus-ci-electron "$GITHUB_WORKSPACE/node_modules/electron/dist/electron" flags=(unconfined) {
            userns,
          }
          profile chorus-ci-packaged "$GITHUB_WORKSPACE/dist/**/chorus" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/chorus-ci-apparmor"
      - name: Unit and process boundary tests
        run: npm test
      - name: Cross-room process stress
        run: npm run test:stress
      - name: Check publication inputs
        run: npm run check:release
      - name: Windows uninstall launcher boundary
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/test-uninstall.ps1
      - name: Windows desktop checks and packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($task in @('test:ui', 'test:rooms', 'test:capabilities', 'test:workbench', 'test:i18n', 'package:release')) {
            npm run $task
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Ubuntu desktop checks and packages
        if: runner.os == 'Linux'
        run: |
          for task in test:ui test:rooms test:capabilities test:workbench test:i18n package:release; do
            xvfb-run --auto-servernum npm run "$task"
          done
      - name: Windows installed startup and scoped removal
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-install.js
      - name: Ubuntu archive, install and uninstall checks
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bash scripts/verify-linux-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Chorus-${{ runner.os }}-x64
          if-no-files-found: error
          path: |
            dist/Chorus-*-release-*/artifacts/*.exe
            dist/Chorus-*-release-*/artifacts/*.zip
            dist/Chorus-*-release-*/artifacts/*.deb
            dist/Chorus-*-release-*/ARTIFACTS.json
